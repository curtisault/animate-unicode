# Tooling for unicel. `mise install` puts every tool below on the path;
# `mise run <task>` is the one entry point for building, checking and serving.
#
#   mise install          the toolchain
#   mise run install      npm install for web/ and site/
#   mise run dev          the site, live, with the wasm built first
#   mise run check        lint, test and build: what sign-off runs, with size
#   mise run signoff      the checks on each open pull request, signed off on GitHub

[tools]
# The pieces, the wasm module and the CLI. `targets` adds the wasm32 target
# alongside the host's, and `components` the lint tools, which a fresh install
# (CI's) leaves out; rust-toolchain.toml says the same for plain rustup.
rust = { version = "1.97", targets = "wasm32-unknown-unknown", components = "rustfmt,clippy" }
# Runs wasm-bindgen's output in tests, the TS shell's build and the site's dev
# server. Also what the npm-backed tools below run on.
node = "26"
# The site. Same form as the global config so the binary resolves the same way.
elm = { version = "0.19.1", bin = "elm" }
# cargo build + wasm-bindgen + wasm-opt in one step, for crates/wasm. A prebuilt
# binary from aqua (the project moved to drager/wasm-pack), so a fresh machine or
# CI runner does not compile it from crates.io. It downloads its own binaryen,
# so wasm-opt needs no entry here.
"aqua:drager/wasm-pack" = "0.15.0"
# Inspecting the built module: `wasm-tools print`, `wasm-tools objdump`, sizes.
wasm-tools = "latest"
# `elm-format --validate` and `elm-test` are part of `mise run check`.
# elm-format comes from its GitHub releases, not npm: the npm package swaps its
# JS launcher for a native binary at install, and mise's npm shim then runs that
# binary with node ("SyntaxError: Invalid or unexpected token").
"github:avh4/elm-format" = "0.8.8"
# elm-test is pinned: npm's `latest` is a 0.19.3 prerelease, and mise's `latest`
# picked 0.19.0, whose old fsevents trips mise's malware advisory check.
"npm:elm-test" = "0.19.1-revision17"
# Runs scripts/font.py with a pinned fonttools, no install: `mise run build:font`.
"aqua:astral-sh/uv" = "0.12.23"
# Reruns a task when files change: `watchexec -e rs -- mise run build:wasm`.
watchexec = "latest"

# The wasm is a module per category, so a page loads only the categories it
# shows: web/pkg/<category>/unicel{.js,_bg.wasm}, each built with that
# category's feature alone, and web/pkg/modules.js, which lists every piece and
# imports each module on first use (crates/unicel/examples/manifest.rs).
# The dev build is one module, web/pkg/all, with every piece and the debug ones:
# one build rather than one per category keeps the edit loop quick.
#
# Both builds write web/pkg, so neither is cached by sources/outputs: after
# `dev` writes the debug build, a cached `build:wasm` would skip and ship it.
# Each starts by emptying web/pkg, so no module of the other build is left.
#
# web/pkg ships inside the npm package, so: --no-pack (no nested package.json),
# and the `*` .gitignore wasm-pack writes beside each module is deleted, since
# npm would honour it and leave the wasm out of the tarball. The root
# .gitignore already keeps web/pkg out of git.
[tasks."build:wasm"]
description = "Build crates/wasm into web/pkg: a module per category (wasm-bindgen, --target web, release), modules.js and sizes.json"
run = """
set -e
rm -rf web/pkg
for c in $(cargo run -q --release -p unicel --example manifest -- categories); do
  wasm-pack --quiet build crates/wasm --target web --release --no-pack --out-dir ../../web/pkg/$c --out-name unicel -- --no-default-features --features $c
  rm -f web/pkg/$c/.gitignore
done
cargo run -q --release -p unicel --example manifest -- write web/pkg
# Each module's gzipped size, which the site shows on a piece's page.
{ printf '{'; sep=''; for f in web/pkg/*/unicel_bg.wasm; do printf '%s"%s":%s' "$sep" "$(basename "$(dirname "$f")")" "$(gzip -9c "$f" | wc -c | tr -d ' ')"; sep=','; done; printf '}\\n'; } > web/pkg/sizes.json
"""

# Its own cargo target dir: the feature set differs, and sharing one would make
# each build overwrite the other's .wasm under target/wasm32-unknown-unknown.
# The manifest runs natively, in the usual target dir.
[tasks."build:wasm:debug"]
description = "Build crates/wasm into web/pkg as one module with every piece and the debug feature: panics print their message and location"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/wasm-debug" }
run = """
set -e
rm -rf web/pkg
wasm-pack build crates/wasm --target web --release --no-pack --out-dir ../../web/pkg/all --out-name unicel -- --features debug
rm -f web/pkg/all/.gitignore
CARGO_TARGET_DIR={{config_root}}/target cargo run -q --release -p unicel --example manifest -- write web/pkg --one all
"""

# The font's output is checked in (web/fonts); run this only to change its ranges
# or the Iosevka version. Downloads the release once into target/font.
[tasks."build:font"]
description = "Subset Iosevka Fixed Extended into web/fonts/unicel-mono.woff2 (scripts/font.py)"
run = "uvx --from 'fonttools[woff]==4.60.1' python -I scripts/font.py"

# The logos' output is checked in (pieces/<category>/art); run this only to add a
# logo or redraw one. Downloads the SVGs once into target/logos.
# Local CI: there is no CI on GitHub. This runs npm ci and lint, test, build and
# size on each open pull request's head commit, in target/ci/tree, and posts a
# `signoff` status to the commit. Arguments narrow it to pull request numbers
# or branch names.
[tasks.signoff]
description = "Check each open pull request's head commit locally and post a signoff status to it (scripts/signoff.sh)"
run = "scripts/signoff.sh"

[tasks."build:logos"]
description = "Draw the logos and distros from their SVGs as octant art (scripts/logo.py)"
run = "uvx --python 3.14 --from 'resvg-py==0.5.0' --with 'pillow==12.3.0' --with 'numpy==2.5.3' python -I scripts/logo.py"

[tasks."build:web"]
description = "Type-check and emit the TS shell (web/dist)"
depends = ["build:wasm"]
dir = "web"
run = "npm run build"

[tasks."build:site"]
description = "Build the Elm site into site/dist (Vite imports the shell's TS source, so only the wasm is needed first)"
depends = ["build:wasm"]
dir = "site"
run = "npm run build"

[tasks.build]
description = "Everything: wasm, shell, site"
depends = ["build:web", "build:site"]

[tasks.dev]
description = "The site with the dev server, after a debug wasm build (run build:wasm before shipping anything from web/pkg)"
depends = ["build:wasm:debug"]
dir = "site"
run = "npm run dev"

[tasks.install]
description = "npm install in web/ and site/ (the workspace root does both)"
run = "npm install"

[tasks.test]
description = "Everything tested: the Rust crates, the wasm boundary from Node, the Elm site"
depends = ["test:rust", "test:wasm", "test:elm"]

[tasks."test:rust"]
description = "Rust unit tests and the piece contract (release: the timing budgets mean nothing in debug)"
run = "cargo test --workspace --release"

[tasks."test:wasm"]
description = "web/test against the release build in web/pkg (and the npm tarball), then against a debug build"
depends = ["build:web"]
env = { CARGO_TARGET_DIR = "{{config_root}}/target/wasm-debug" }
run = [
  "node --test 'web/test/*.test.mjs'",
  "rm -rf target/wasm-debug-pkg",
  "wasm-pack --quiet build crates/wasm --target web --release --no-pack --out-dir ../../target/wasm-debug-pkg/all --out-name unicel -- --features debug",
  "CARGO_TARGET_DIR={{config_root}}/target cargo run -q --release -p unicel --example manifest -- write target/wasm-debug-pkg --one all",
  "WASM_PKG=target/wasm-debug-pkg WASM_DEBUG=1 node --test 'web/test/*.test.mjs'",
]

[tasks."test:elm"]
description = "The site's Elm tests (site/tests): routes, the meta decoder, options"
dir = "site"
run = "elm-test"

[tasks.fmt]
description = "Format everything"
run = ["cargo fmt --all", "elm-format site/src site/tests --yes", "npm --prefix web run fmt"]

[tasks.lint]
description = "rustfmt --check, clippy, rustdoc, elm-format --validate, tsc --noEmit (needs the wasm: the shell imports web/pkg's types)"
depends = ["build:wasm"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps -p unicel",
  "cargo clippy -p unicel-wasm --target wasm32-unknown-unknown -- -D warnings",
  "cargo clippy -p unicel-wasm --target wasm32-unknown-unknown --features debug -- -D warnings",
  "elm-format site/src site/tests --validate",
  "npm --prefix web run typecheck",
  "npm --prefix site run typecheck",
]

[tasks.play]
description = "Play a piece in this terminal: `mise run play donut --seconds 5` (any key stops it)"
run = "cargo run --release -q -p unicel-cli --"

[tasks.show]
description = "Print a piece's frames at t = 0, 1, 2.5, 5 in a box: `mise run show donut` (no slug = every piece)"
run = "cargo run --release -q -p unicel --example show --"

[tasks.bench]
description = "Time 60 frames of each piece and print a table: `mise run bench [slug ...]`"
run = "cargo run --release -q -p unicel --example bench --"

# Fails when any module passes 150 KB gzipped: a page showing one piece loads
# that piece's category, so that is the size a reader pays for. The total is
# what a page showing every category loads. WASM_GZ_LIMIT overrides the limit
# (in bytes).
[tasks.size]
description = "Raw and gzipped size of each release wasm module, and the total; fails when a module passes 150 KB gzipped (225 KB for a scenes category: cities, nights, wilds, cyberpunk)"
depends = ["build:wasm"]
run = """
limit=${WASM_GZ_LIMIT:-153600}
scene_limit=${WASM_GZ_SCENE_LIMIT:-230400}
total=0
over=""
for f in web/pkg/*/unicel_bg.wasm; do
  m=$(basename $(dirname $f))
  raw=$(wc -c < $f | tr -d ' ')
  gz=$(gzip -9c $f | wc -c | tr -d ' ')
  total=$((total + gz))
  line="wasm $m: $raw bytes raw, $gz bytes gzipped"
  echo "$line"
  if [ -n "$GITHUB_STEP_SUMMARY" ]; then echo "$line" >> "$GITHUB_STEP_SUMMARY"; fi
  case $m in cities|nights|wilds|cyberpunk) max=$scene_limit ;; *) max=$limit ;; esac
  if [ "$gz" -gt "$max" ]; then over="$over $m"; fi
done
line="wasm, every module: $total bytes gzipped (limit $limit a module, $scene_limit a scenes category)"
echo "$line"
if [ -n "$GITHUB_STEP_SUMMARY" ]; then echo "$line" >> "$GITHUB_STEP_SUMMARY"; fi
if [ -n "$over" ]; then
  echo "over the size limit:$over. See 'One wasm module per category' in docs/IMPLEMENTATION_PLAN.md" >&2
  exit 1
fi
"""

[tasks.check]
description = "What CI runs: lint, test, build"
depends = ["lint", "test", "build"]
