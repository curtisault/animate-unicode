[package]
name = "unicel-cli"
description = "Plays a piece in the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "unicel"
path = "src/main.rs"

[dependencies]
unicel = { path = "../unicel" }
crossterm = "0.29"
# The local zone's offset from UTC, for pieces that show the time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM and SIGHUP set a flag the player checks, so the terminal is put back.
signal-hook = "0.4"
