[package]
name = "animate-unicode-cli"
description = "Plays a piece in the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "animate-unicode"
path = "src/main.rs"

[dependencies]
animate-unicode = { path = "../animate-unicode" }
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
# SIGTERM and SIGHUP set a flag the player checks, so the terminal is put back.
signal-hook = "0.4"
