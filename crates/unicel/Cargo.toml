[package]
name = "unicel"
description = "Animated unicode art: pieces that draw a grid of code points, frame by frame"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "unicel"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

# A feature for each category: all of them by default, one alone for that
# category's wasm module (`mise run build:wasm` builds each that has pieces).
[features]
default = ["all"]
all = ["cities", "nights", "wilds", "cyberpunk", "ui", "data", "type", "logos", "distros", "shapes", "space", "physics", "nature", "creatures", "objects", "generative", "effects"]
cities = []
nights = []
wilds = []
cyberpunk = []
ui = []
data = []
type = []
logos = []
distros = []
shapes = []
space = []
physics = []
nature = []
creatures = []
objects = []
generative = []
effects = []
