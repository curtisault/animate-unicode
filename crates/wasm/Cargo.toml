[package]
name = "animate-unicode-wasm"
description = "The pieces for the browser: a Player whose grid JS reads straight out of wasm memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
animate-unicode = { path = "../animate-unicode", default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
# Which categories of pieces this module holds: every one by default (the dev
# build, and the CLI's and the tests' view), or one alone with
# --no-default-features, as `mise run build:wasm` builds each module.
default = ["all"]
all = ["animate-unicode/all"]
scenes = ["animate-unicode/scenes"]
ui = ["animate-unicode/ui"]
data = ["animate-unicode/data"]
type = ["animate-unicode/type"]
logos = ["animate-unicode/logos"]
shapes = ["animate-unicode/shapes"]
space = ["animate-unicode/space"]
physics = ["animate-unicode/physics"]
nature = ["animate-unicode/nature"]
creatures = ["animate-unicode/creatures"]
objects = ["animate-unicode/objects"]
generative = ["animate-unicode/generative"]
effects = ["animate-unicode/effects"]

# Dev builds only (`mise run dev`, and the panic test in `mise run test`): a
# panic prints its message and location with console.error before the call
# traps, and Player accepts the unregistered slug "debug-panic" to show it.
# Release builds leave both out; see "Panics" in src/lib.rs.
debug = ["dep:console_error_panic_hook"]

# wasm-pack runs wasm-opt on the output; these are its flags.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
