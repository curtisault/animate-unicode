[package]
name = "animate-unicode"
description = "Animated unicode art: pieces that draw a grid of code points, frame by frame"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "animate_unicode"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

# A feature for each category: all of them by default, one alone for that
# category's wasm module (`mise run build:wasm` builds each that has pieces).
[features]
default = ["all"]
all = ["scenes", "ui", "data", "type", "logos", "companies", "distros", "shapes", "space", "physics", "nature", "creatures", "objects", "generative", "effects"]
scenes = []
ui = []
data = []
type = []
logos = []
companies = []
distros = []
shapes = []
space = []
physics = []
nature = []
creatures = []
objects = []
generative = []
effects = []
